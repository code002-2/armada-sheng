---
# Flashable Armada with the vendor-ABL-style install path and the EXACT
# container content: the already-built Armada container (kernel sheng
# 7.2.2, Steam/FEX/Proton/gamescope, KDE Plasma, Decky plugins, device
# services) is exported verbatim into a plain ext4 rootfs.img — no bootc,
# no BIB, no OSTree. OTA entry points are stubbed out; everything else is
# identical to the container image.
#
# Boot: boot_b.img (header-v0, verified loadable on this ABL) + single
# ext4 root (growfs, /boot inside root). Single-system only (userdata).
#
# Publish: the artifact is split into <2 GB chunks and uploaded to a GitHub
# Release (GitHub caps individual release files at 2 GB).
name: Build Armada flashable (container export, no OTA)

on:
  workflow_dispatch:
    inputs:
      container_ref:
        description: "Armada container to export (ghcr ref:tag)"
        type: string
        default: "ghcr.io/code002-2/armada-sheng:sheng-latest"
      console_mode:
        description: "quiet = armada splash; verbose = loglevel=7 console (diagnose boot hangs)"
        type: choice
        options: [quiet, verbose]
        default: quiet
      publish_release:
        description: "Publish the flashable to a GitHub Release (overwrites the 'sheng-flashable' tag)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  export:
    name: Export container to flashable rootfs
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: read

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl jq pigz python3 e2fsprogs

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Export and package
        env:
          REF: ${{ inputs.container_ref }}
          ROOT_PART: userdata
          MODE: ${{ inputs.console_mode }}
        run: |
          set -euxo pipefail
          sudo bash .github/scripts/armada-export-flashable.sh \
            "${REF}" "${{ github.workspace }}/output" "${ROOT_PART}" "${MODE}"
          sudo chown -R "$(id -u):$(id -g)" output
          ls -lh output/

      - name: Upload flashable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: armada-flashable-no-ota
          path: output/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
          overwrite: true

      - name: Split rootfs.img for Release (GitHub caps files at 2 GB)
        run: |
          set -euxo pipefail
          cd output
          # 1.9 GB chunks keep every part comfortably under the 2 GB cap.
          split -b 1900M rootfs.img rootfs.img.part.
          rm -f rootfs.img
          # Merge script + checksum for the whole original image.
          printf '%s\n' \
            '#!/bin/bash' \
            'set -e' \
            'echo "Merging rootfs.img parts..."' \
            'cat rootfs.img.part.* > rootfs.img' \
            'sha256sum -c SHA256SUMS' \
            'echo "rootfs.img ready. Run: fastboot flash userdata rootfs.img"' > merge-rootfs.sh
          chmod +x merge-rootfs.sh
          sha256sum rootfs.img.part.* > SHA256SUMS.parts
          ls -lh
      - name: Create Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: sheng-flashable
          name: "Armada sheng flashable (no OTA)"
          body: |
            ## Armada for Xiaomi Pad 6S Pro (sheng) — flashable, no OTA

            Single-system fastboot install (`userdata` partition, Android erased).

            **Files:**
            - `boot_b.img` — kernel + initramfs + DTB (Android header-v0)
            - `rootfs.img.part.*` — 22 GB ext4 rootfs split into chunks (GitHub caps single files at 2 GB)
            - `merge-rootfs.sh` — merges the chunks back into `rootfs.img` + verifies checksums
            - `flash.sh` — fastboot wrapper (erase dtbo_b → flash boot_b → erase+flash userdata → reboot)
            - `MANIFEST.txt` — build metadata

            **Flash:**
            ```
            ./merge-rootfs.sh          # produces rootfs.img (or: cat rootfs.img.part.* > rootfs.img)
            fastboot erase dtbo_b
            fastboot flash boot_b boot_b.img
            fastboot erase userdata
            fastboot flash userdata rootfs.img
            fastboot reboot
            ```

            ⚠️ Requires an unlocked bootloader. Back up your data first — this erases Android's userdata.
          files: output/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
